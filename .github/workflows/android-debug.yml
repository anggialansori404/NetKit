name: Build APK (debug)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Compress APKs to Zip
        run: |
          cd android/app/build/outputs/apk/debug
          zip -9 -r netkit-debug-apks.zip *.apk
          ls -lh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: netkit-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          compression-level: 9
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug
          name: Debug build
          prerelease: true
          files: |
            android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            android/app/build/outputs/apk/debug/app-universal-debug.apk
            android/app/build/outputs/apk/debug/netkit-debug-apks.zip
